[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeropo11"
version = "2.0.0"
description = "0xPo11 - A Cryptographic Suite by CosmodiumCS"
readme = "README.MD"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "CosmodiumCS" },
]
dependencies = [
    "colorama>=0.4.6",
]

[project.optional-dependencies]
full = [
    "googletrans==3.1.0a0",
    "numpy>=1.24",
    "Pillow>=9.4",
    "pyenchant>=3.2",
    "qrcode>=7.0",
    "twofish>=0.3",
    "blowfish>=0.6",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
crypto = [
    "twofish>=0.3",
    "blowfish>=0.6",
]

[project.scripts]
key = "zeropo11.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
